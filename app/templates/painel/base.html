<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block titulo %}Painel{% endblock %} · Rastreio</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/painel.css') }}">
  <script src="{{ url_for('static', filename='js/painel.js') }}" defer></script>
</head>
<body>
  {% if current_user.is_authenticated %}
  <header class="topo">
    <nav class="menu">
      <strong>Rastreio</strong>
      <a href="{{ url_for('painel.inicio') }}">Pedidos</a>
      <a href="{{ url_for('painel.novo_pedido') }}">Novo pedido</a>
    </nav>
    <form method="post" action="{{ url_for('painel.logout') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <span>{{ current_user.nome }}</span>
      <button type="submit" class="botao-secundario">Sair</button>
    </form>
  </header>
  {% endif %}

  <main class="conteudo">
    {% with mensagens = get_flashed_messages(with_categories=true) %}
      {% for categoria, texto in mensagens %}
        <div class="aviso aviso-{{ categoria }}">{{ texto }}</div>
      {% endfor %}
    {% endwith %}

    {% block conteudo %}{% endblock %}
  </main>
</body>
</html>
